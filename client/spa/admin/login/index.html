    /* Loader overlay (shows instantly, no FOUC) */
    #boot-loader {

      justify-content: center;
      background: #fff;

    /* The marketing markup ships its own stylesheets, fetched at runtime. This gate must live in the

    .dma-react-root:not(.dma-css-ready),
    .svc-react-root:not(.svc-css-ready),
    .wrk-react-root:not(.wrk-css-ready),
    .abt-react-root:not(.abt-css-ready) {

    .dma-react-root,
    .svc-react-root,
    .wrk-react-root,
    .abt-react-root {
      transition: opacity .2s ease;
    }

    .boot-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(0, 0, 0, .15);
      border-top-color: rgba(0, 0, 0, .65);
      border-radius: 50%;
      animation: bootspin .8s linear infinite;
    }

    @keyframes bootspin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Intro loader (public/intro/melange-intro.js). This cover holds the screen from the first

    html.mlg-intro {

    }

    html.mlg-intro::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 100000;

  <script>
    /* Intro loader: the paper-fan logo plays on the first page of a visit only. Never for

    (function () {
      try {
        var d = document.documentElement, n = navigator;
        if (window.__PRERENDERING__ || n.webdriver) return;
        if (/bot|crawl|spider|slurp|facebookexternalhit|preview|headless/i.test(n.userAgent)) return;
        if (/^\/admin/.test(location.pathname)) return;
        if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        if (sessionStorage.getItem("mlg-intro")) return;
        sessionStorage.setItem("mlg-intro", "1");
        d.classList.add("mlg-intro");
        var s = document.createElement("script");
        s.src = "/intro/melange-intro.js?v=20261124a";
        s.async = true;
        s.onerror = function () { d.classList.remove("mlg-intro"); };
        document.head.appendChild(s);
        setTimeout(function () { if (!window.__mlgIntro) d.classList.remove("mlg-intro"); }, 1500);
      } catch (e) {}
    })();
  </script>
