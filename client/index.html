<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" sizes="32x32" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link data-rh="true" rel="canonical" href="https://melangedigital.co/">

  <base href="/" />

  <!-- Meta Tags -->
  <title data-rh="true">Global Travel &amp; Tourism Marketing Agency | Mélange Digital</title>
  <meta data-rh="true" name="description" content="Mélange is a travel and tourism marketing agency in India, turning cultural insight into arrivals for tourism boards and travel brands worldwide. Book a call.">
  <meta data-rh="true" property="og:type" content="website">
  <meta data-rh="true" property="og:url" content="https://melangedigital.co/">
  <meta data-rh="true" property="og:title" content="Global Travel &amp; Tourism Marketing Agency | Mélange Digital">
  <meta data-rh="true" property="og:description" content="Mélange Digital helps tourism boards and travel brands worldwide turn cultural insight into arrivals through travel marketing. Book a call.">
  <meta data-rh="true" property="og:image" content="https://melangedigital.co/og-home.png">
  <meta data-rh="true" property="og:image:width" content="1200">
  <meta data-rh="true" property="og:image:height" content="632">
  <meta data-rh="true" property="og:image:alt" content="Mélange Digital — Travel &amp; Tourism Marketing Agency">
  <meta data-rh="true" name="twitter:card" content="summary_large_image">
  <meta data-rh="true" name="twitter:image" content="https://melangedigital.co/og-home.png">
  <!-- End of Meta Tags -->

  <!-- Schema Markup -->
  <!-- Injected per-route by Express seo-head.cjs (page-schemas.cjs). Do not paste static JSON-LD here. -->
  <!-- End of Schema Markup -->

  <style>
    html,
    body {
      margin: 0;
      background: #fff;
    }

    #root {
      min-height: 100vh;
      background: #fff;
    }

    /* Loader overlay (shows instantly, no FOUC) */
    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      z-index: 99999;
    }

    #boot-loader.hidden {
      display: none;
    }

    /* The marketing markup ships its own stylesheets, fetched at runtime. This gate must live in the
       static head: put it in a React-injected <style> and it lands a paint too late, so the raw
       markup flashes unstyled on every reload. */
    .dma-react-root:not(.dma-css-ready),
    .svc-react-root:not(.svc-css-ready),
    .wrk-react-root:not(.wrk-css-ready),
    .abt-react-root:not(.abt-css-ready) {
      opacity: 0 !important;
      visibility: hidden !important;
    }

    .dma-react-root,
    .svc-react-root,
    .wrk-react-root,
    .abt-react-root {
      transition: opacity .2s ease;
    }

    .boot-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(0, 0, 0, .15);
      border-top-color: rgba(0, 0, 0, .65);
      border-radius: 50%;
      animation: bootspin .8s linear infinite;
    }

    @keyframes bootspin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- Meta Pixel Code -->
  <script>
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return; n = f.fbq = function () {
        n.callMethod ?
          n.callMethod.apply(n, arguments) : n.queue.push(arguments)
      };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
      n.queue = []; t = b.createElement(e); t.async = !0;
      t.src = v; s = b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t, s)
    }(window, document, 'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '705063051094773');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=705063051094773&ev=PageView&noscript=1" />
  </noscript>
  <!-- End Meta Pixel Code -->

  <div id="boot-loader" aria-label="Loading">
    <div class="boot-spinner"></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

</body>
</html>
