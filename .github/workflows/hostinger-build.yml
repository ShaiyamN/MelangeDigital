# Vite-build spa on GitHub, commit it to staging. Hostinger never runs Vite.
name: Hostinger prebuild

on:
  push:
    branches: [staging, main]
    paths-ignore:
      - "client/spa/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install and build
        run: npm ci --no-audit --no-fund --legacy-peer-deps --include=dev && npm run build:full
        env:
          FORCE_VITE_BUILD: "1"

      - name: Commit spa to staging
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/spa
          if git diff --cached --quiet; then
            echo "spa unchanged"
            exit 0
          fi
          git commit -m "build: spa for Hostinger (${GITHUB_SHA::7})"
          git push origin HEAD:${GITHUB_REF_NAME}
