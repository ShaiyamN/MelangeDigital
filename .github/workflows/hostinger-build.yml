# Vite-build spa on GitHub, commit it to staging. Hostinger never runs Vite.
name: Hostinger prebuild

on:
  push:
    branches: [staging, main]
    paths-ignore:
      - "client/spa/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      # ── Secrets gate ───────────────────────────────────────────
      # Fail visibly instead of silently producing an empty build.
      - name: Check Firebase secrets
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ]; then
            echo "::warning::VITE_FIREBASE_* repository secrets are not set. spa/ was NOT rebuilt. Add them from client/.env.example."
            echo "SECRETS_PRESENT=false" >> "$GITHUB_ENV"
          else
            echo "SECRETS_PRESENT=true" >> "$GITHUB_ENV"
          fi
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}

      - name: Install and build
        if: env.SECRETS_PRESENT == 'true'
        run: npm ci --no-audit --no-fund --legacy-peer-deps --include=dev && npm run build:full
        env:
          FORCE_VITE_BUILD: "1"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}

      # ── Validate build output ──────────────────────────────────
      - name: Validate spa
        if: env.SECRETS_PRESENT == 'true'
        run: |
          set -euo pipefail
          if [ ! -f spa/index.html ]; then
            echo "::error::spa/index.html missing after build"
            exit 1
          fi
          # Ensure the bundle <script> tag references a real file
          BUNDLE=$(grep -oP 'src="/assets/index-[^"]+\.js"' spa/index.html | head -1 | sed 's/src="//;s/"//')
          if [ -z "$BUNDLE" ]; then
            echo "::error::No JS bundle reference found in spa/index.html"
            exit 1
          fi
          if [ ! -f "spa${BUNDLE}" ]; then
            echo "::error::Bundle file spa${BUNDLE} missing"
            exit 1
          fi
          echo "✓ spa/index.html valid — bundle: ${BUNDLE}"

      # ── Commit & push (with rebase to avoid conflicts) ─────────
      - name: Commit spa
        if: env.SECRETS_PRESENT == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/spa
          if git diff --cached --quiet; then
            echo "spa unchanged"
            exit 0
          fi
          git commit -m "build: spa for Hostinger (${GITHUB_SHA::7})"
          # Pull with rebase to handle concurrent pushes, then push
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME}
