# Builds a thin hostinger-dist branch (no src/, no 2GB clone) for Hostinger.
# Hostinger must deploy branch hostinger-dist, root client, output directory empty.
name: Hostinger prebuild

on:
  push:
    branches: [staging, main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install and build
        run: npm ci --no-audit --no-fund --legacy-peer-deps --include=dev && npm run build:full
        env:
          FORCE_VITE_BUILD: "1"

      - name: Publish thin hostinger-dist
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          THIN=$(mktemp -d)
          mkdir -p "$THIN/client"
          cp client/package.json client/package-lock.json client/server.js client/server.cjs client/.nvmrc client/.npmrc "$THIN/client/"
          cp -a client/scripts "$THIN/client/scripts"
          cp -a client/spa "$THIN/client/spa"
          cp -a client/public "$THIN/client/public"
          rm -rf "$THIN/client/public/videos" "$THIN/client/spa/videos"
          rm -rf "$THIN/client/spa/destination-marketing-agency"
          cd "$THIN"
          git init
          git checkout -b hostinger-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "thin Hostinger payload ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin hostinger-dist --force
